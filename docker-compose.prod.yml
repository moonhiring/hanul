# 프로덕션 오버라이드 — 사용법:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 개발용 compose와의 차이:
#   - DB 포트를 외부에 열지 않음 (5432는 컨테이너 내부망 전용)
#   - api 소스 볼륨 마운트 제거 (이미지에 베이크된 코드 사용 — npm 의존성 포함)
#   - 전 서비스 restart: unless-stopped
#   - web은 80 포트로 직접 서빙 (앞단 TLS는 Cloudflare가 담당)

services:
  db:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    # volumes 오버라이드 없음 — 서버는 git 클론이라 base의 src/db/seed 마운트가 곧 배포 코드.
    # (!reset에 새 값을 같이 쓰면 이 compose 버전에서 값이 유실되어 사용하지 않음)

  web:
    restart: unless-stopped
