# 프로덕션 오버라이드 — 사용법:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 개발용 compose와의 차이:
#   - DB 포트를 외부에 열지 않음 (5432는 컨테이너 내부망 전용)
#   - api 소스 볼륨 마운트 제거 (이미지에 베이크된 코드 사용 — npm 의존성 포함)
#   - 전 서비스 restart: unless-stopped
#   - web은 80 포트로 직접 서빙 (앞단 TLS는 Cloudflare가 담당)

services:
  db:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    volumes: !reset []

  web:
    restart: unless-stopped
    ports:
      # 호스트 nginx(기존 사이트와 공존)가 80/443을 쓰므로 로컬 전용으로 바인딩.
      # 호스트 nginx가 hanul.world → 127.0.0.1:8090 으로 프록시 + TLS 종단.
      # (서버에서 8080은 기존 컨테이너가 사용 중)
      - "127.0.0.1:8090:80"
