# 프로덕션 오버라이드 — 사용법:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 개발용 compose와의 차이:
#   - DB 포트를 외부에 열지 않음 (5432는 컨테이너 내부망 전용)
#   - api 소스 볼륨 마운트 제거 (이미지에 베이크된 코드 사용 — npm 의존성 포함)
#   - 전 서비스 restart: unless-stopped
#   - web은 80 포트로 직접 서빙 (앞단 TLS는 Cloudflare가 담당)

services:
  db:
    restart: unless-stopped
    ports: !reset []

  api:
    restart: unless-stopped
    # 개발용 소스 마운트는 제거하되 시드 파일 마운트는 유지 (부팅 시 8,274건 시드에 필요)
    volumes: !reset
      - ./app/public/seed:/seed:ro

  web:
    restart: unless-stopped
