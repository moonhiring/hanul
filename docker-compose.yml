services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hanul
      POSTGRES_PASSWORD: hanul
      POSTGRES_DB: hanul
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanul"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://hanul:hanul@db:5432/hanul
      SEED_FILE: /seed/businesses.json
      PORT: 4000
      # Google 로그인 — 쉘 환경변수로 주입 (미설정 시 로그인 버튼이 '설정 필요'로 표시됨)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # 관리자 이메일 (쉼표 구분) — 이 이메일로 로그인하면 자동 admin 승격
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - ./app/public/seed:/seed:ro
      - ./api/src:/app/src:ro
      - ./api/db:/app/db:ro
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
